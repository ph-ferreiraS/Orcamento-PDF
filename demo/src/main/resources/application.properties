spring.application.name=orcamento-automotivo
# Dados de Conexão (Senha como variável de ambiente)
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_orcamento?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.profiles.active=dev

# Estratégia de criação de tabelas
# 'update' cria as tabelas automaticamente baseadas nas classes @Entity
spring.jpa.hibernate.ddl-auto=update

# Logs para ver o Spring criando as tabelas no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true